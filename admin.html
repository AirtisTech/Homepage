<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airtis Admin - 后台管理系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="login-container" class="glass-panel">
        <div class="logo">Airtis <span>Admin</span></div>
        <h2>登录后台</h2>
        <form id="login-form">
            <div class="input-group">
                <label>管理员密码</label>
                <input type="password" id="admin-password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn">进入管理系统</button>
            <p id="login-error" class="error-msg" style="display: none;">密码错误！</p>
        </form>
    </div>

    <div id="admin-dashboard" class="glass-panel" style="display: none;">
        <div class="dashboard-header">
            <div class="logo">Airtis <span>Admin</span></div>
            <button id="logout-btn" class="btn btn-outline">退出登录</button>
        </div>
        
        <div class="dashboard-content">
            <div class="form-section">
                <h3>添加新作品</h3>
                <form id="add-portfolio-form">
                    <div class="input-group">
                        <label>作品标题</label>
                        <input type="text" id="p-title" placeholder="例如：未来资产管理平台" required>
                    </div>
                    <div class="input-group">
                        <label>作品分类</label>
                        <select id="p-category" required>
                            <option value="design">UI/UX 设计</option>
                            <option value="dev">技术开发</option>
                            <option value="brand">品牌创意</option>
                            <option value="photo">商业摄影 / 视频</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>作品链接 (支持YouTube、Vimeo视频链接或普通图片链接)</label>
                        <input type="url" id="p-url" placeholder="https://..." required>
                    </div>
                    <div class="input-group">
                        <label>作品简介</label>
                        <textarea id="p-desc" rows="3" placeholder="简短描述该作品..."></textarea>
                    </div>
                    <input type="hidden" id="p-id" value="">
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary" id="save-btn" style="flex: 1;">
                            <i class="fa-solid fa-cloud-arrow-up"></i> 保存并发布
                        </button>
                        <button type="button" class="btn btn-outline" id="cancel-edit-btn" style="display: none;">
                            取消
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="list-section">
                <h3>已发布的项目</h3>
                <div id="portfolio-list" class="portfolio-list">
                    <div class="loading">正在加载数据...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase App (the core Firebase SDK) -->
    <script type="module" src="admin.js"></script>
</body>
</html>
